<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7360b8">
  <meta name="description" content="Личный диалог с Тихоном.">
  <title>Тихон — диалог</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/scare-face.jpg" as="image">
  <link rel="stylesheet" href="./styles.css">
  <script src="./assets/scare-audio.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7M7 12h14"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M7 3H4a1 1 0 0 0-1 1c0 9.4 7.6 17 17 17a1 1 0 0 0 1-1v-3l-5-2-2 2a15 15 0 0 1-7-7l2-2Z"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></symbol>
    <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14s1 3 4 3 4-3 4-3M8 8.5h.01M16 8.5h.01"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 7h4l2-3h4l2 3h4a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="4"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 6-6 5 5 3-3 4 4"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 11v1a6 6 0 0 0 12 0v-1M12 18v3M9 21h6"/></symbol>
    <symbol id="i-sticker" viewBox="0 0 24 24"><path d="M20 14V6a3 3 0 0 0-3-3H6a3 3 0 0 0-3 3v11a3 3 0 0 0 3 3h8l6-6ZM14 20v-3a3 3 0 0 1 3-3h3M7 8h.01M13 8h.01M7 12s1 2 3 2 3-2 3-2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a9 9 0 0 1-9 9 10 10 0 0 1-4-.8L3 21l1.3-4.8A9 9 0 1 1 21 11.5Z"/><path d="M8 9h8M8 13h5"/></symbol>
  </svg>

  <main id="page" class="chat-window" aria-label="Диалог с Тихоном">
    <header class="chat-header">
      <span class="header-icon" aria-hidden="true"><svg><use href="#i-back"/></svg></span>
      <div class="avatar" aria-hidden="true">Т</div>
      <div class="contact"><h1>Тихон</h1><p>Личный диалог</p></div>
      <div class="header-actions" aria-hidden="true"><svg><use href="#i-phone"/></svg><svg><use href="#i-dots"/></svg></div>
    </header>

    <section class="conversation" aria-label="Пустой диалог">
      <span class="date-label">Сегодня</span>
      <div class="start-note"><svg aria-hidden="true"><use href="#i-chat"/></svg><p>Это начало вашего диалога<br>с Тихоном.</p></div>
      <div id="messages" class="messages" aria-label="Сообщения"></div>
    </section>

    <footer class="composer">
      <div class="message-row">
        <input id="message" type="text" placeholder="Напишите сообщение…" aria-label="Черновик сообщения" maxlength="1000" autocomplete="off" spellcheck="false">
        <span class="microphone" aria-hidden="true"><svg><use href="#i-mic"/></svg></span>
      </div>
      <div class="composer-tools" aria-hidden="true">
        <svg><use href="#i-sticker"/></svg><svg><use href="#i-smile"/></svg><svg><use href="#i-camera"/></svg><svg><use href="#i-image"/></svg><span class="tool-dots">•••</span><svg class="add-tool"><use href="#i-plus"/></svg>
      </div>
      <p class="draft-note">Черновик · сообщения не отправляются</p>
    </footer>
    <noscript><p class="noscript">Для работы страницы включите JavaScript.</p></noscript>
  </main>
  <p class="desktop-note">Личный диалог</p>

  <div id="scare" class="scare" role="region" aria-labelledby="scare-label" tabindex="-1" hidden>
    <h2 id="scare-label" class="sr-only">Скример повторяется. Чтобы остановить, закройте страницу или перейдите на другую вкладку.</h2>
    <img id="scare-image" class="scare-image" src="./assets/scare-face.jpg" alt="Лицо из ролика: большие круглые глаза и широкая улыбка" width="628" height="480">
  </div>
</body>
</html>
